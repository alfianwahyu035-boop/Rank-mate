plugins {
    id 'com.android.application'
}
android {
    namespace 'com.rankmate.dashboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rankmate.dashboard'
        minSdk 29
        targetSdk 35
        versionCode 54
        versionName '5.4.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No third-party native dependencies. All application JS/CSS/Excel parsers
// are contained in app/src/main/assets/index.html.
