name: Build RankMate Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build RankMate debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      # This repository includes a custom bootstrap jar, not the official Gradle
      # Wrapper JAR. It is unused in CI: the setup-gradle action installs Gradle 8.9.
      # Remove ONLY in this checkout so default wrapper security checks stay on.
      - name: Exclude unused custom Gradle wrapper from CI
        run: rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore missing native Android resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:fullBackupContent="@xml/backup_rules"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.RankMate"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          fi
          if [ ! -f app/src/main/res/drawable/ic_launcher_foreground.xml ] && [ ! -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png ]; then
            cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'DRAWABLE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFCF29" android:pathData="M19,18 H89 V90 H19 Z"/>
              <path android:fillColor="#101010" android:pathData="M32,35 H76 V43 H32 Z M32,46 H61 V54 H32 Z M32,57 H75 V65 H32 Z M32,68 H63 V76 H32 Z"/>
          </vector>
          DRAWABLE
          fi

      - name: Build RankMate Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RankMate-V5-4-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
